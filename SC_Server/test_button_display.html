<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按钮显示测试</title>
    <link rel="stylesheet" href="app/static/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="app/static/vendor/bootstrap-icons/css/bootstrap-icons.css">
    <link rel="stylesheet" href="app/static/css/style.css">
</head>
<body>
    <div class="container mt-5">
        <h1>按钮显示测试</h1>
        
        <div class="row">
            <div class="col-12">
                <h3>规则管理按钮</h3>
                <div class="btn-group mb-3">
                    <a href="#" class="btn btn-primary">
                        <i class="bi bi-upload"></i> 导入规则集
                    </a>
                    <a href="#" class="btn btn-outline-secondary">
                        <i class="bi bi-download"></i> 下载示例
                    </a>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <h3>操作按钮</h3>
                <div class="btn-group mb-3">
                    <a href="#" class="btn btn-sm btn-info" title="查看详情">
                        <i class="bi bi-eye"></i> 查看
                    </a>
                    <a href="#" class="btn btn-sm btn-warning" title="编辑规则集">
                        <i class="bi bi-pencil"></i> 编辑
                    </a>
                    <a href="#" class="btn btn-sm btn-success" title="激活规则集">
                        <i class="bi bi-check-circle"></i> 激活
                    </a>
                    <a href="#" class="btn btn-sm btn-primary" title="导出规则集">
                        <i class="bi bi-download"></i> 导出
                    </a>
                    <a href="#" class="btn btn-sm btn-danger" title="删除规则集">
                        <i class="bi bi-trash"></i> 删除
                    </a>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <h3>表单按钮</h3>
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-upload"></i> 导入规则集
                    </button>
                    <button type="button" class="btn btn-success">
                        <i class="bi bi-save"></i> 保存更改
                    </button>
                    <button type="button" class="btn btn-outline-primary">
                        <i class="bi bi-download"></i> 下载示例规则文件
                    </button>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <h3>小按钮组</h3>
                <div class="btn-group btn-group-sm mb-3">
                    <button type="button" class="btn btn-outline-primary btn-sm" title="编辑文件类型">
                        <i class="bi bi-pencil"></i> 编辑
                    </button>
                    <button type="button" class="btn btn-outline-danger btn-sm" title="删除文件类型">
                        <i class="bi bi-trash"></i> 删除
                    </button>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <h3>侧边栏按钮</h3>
                <div class="mb-3">
                    <button type="button" class="btn btn-info" title="切换侧边栏">
                        <i class="bi bi-list"></i> 菜单
                    </button>
                    <a href="#" class="btn btn-outline-light btn-sm bg-dark text-light">
                        <i class="bi bi-box-arrow-right"></i> 退出
                    </a>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <h3>测试说明</h3>
                <div class="alert alert-info">
                    <h5>检查项目：</h5>
                    <ul>
                        <li>✅ 所有按钮都应该显示文字</li>
                        <li>✅ 图标应该在文字前面（如果加载成功）</li>
                        <li>✅ 即使图标不加载，文字也应该可见</li>
                        <li>✅ 按钮颜色应该正确</li>
                        <li>✅ 悬停效果应该正常</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <h3>无图标测试</h3>
                <p>以下按钮故意不包含图标，测试纯文字显示：</p>
                <div class="btn-group mb-3">
                    <a href="#" class="btn btn-primary">导入规则集</a>
                    <a href="#" class="btn btn-warning">编辑</a>
                    <a href="#" class="btn btn-success">激活</a>
                    <a href="#" class="btn btn-danger">删除</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app/static/vendor/jquery/jquery.min.js"></script>
    <script src="app/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 检查图标字体是否加载
        document.addEventListener('DOMContentLoaded', function() {
            const testIcon = document.createElement('i');
            testIcon.className = 'bi bi-check';
            testIcon.style.position = 'absolute';
            testIcon.style.left = '-9999px';
            document.body.appendChild(testIcon);
            
            setTimeout(function() {
                const computed = window.getComputedStyle(testIcon, ':before');
                const content = computed.getPropertyValue('content');
                
                if (content && content !== 'none' && content !== '""') {
                    console.log('✅ Bootstrap Icons 加载成功');
                } else {
                    console.log('❌ Bootstrap Icons 未加载');
                    alert('Bootstrap Icons 图标字体未正确加载，但按钮文字应该仍然可见');
                }
                
                document.body.removeChild(testIcon);
            }, 100);
        });
    </script>
</body>
</html>
