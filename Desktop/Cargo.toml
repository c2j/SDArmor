[package]
name = "sdchat-scanner"
version = "0.1.0"
edition = "2021"
authors = ["SDChat Team"]
description = "Security vulnerability scanner client"
readme = "README.md"
license = "MIT"
repository = "https://github.com/sdchat/sdchat-scanner"
build = "build.rs"

[dependencies]
# GUI
egui = "0.25.0"
eframe = "0.25.0"
wgpu = "0.17"
epaint = "0.25.0"

# Core engine
tokio = { version = "1.0", features = ["full"] }
rayon = "1.8.0"
regex = "1.10.2"
hyperscan = { version = "0.3.2", optional = true }
num_cpus = "1.16.0"
rand = "0.8.5"

# Networking
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream", "blocking"] }
openssl = { version = "0.10", optional = true, features = ["vendored"] }
http = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3.28"
url = "2.4.1"

# Utilities
semver = "1.0.20"
chrono = { version = "0.4.31", features = ["serde"] }
log = "0.4.20"
env_logger = "0.10.1"
anyhow = "1.0.75"
thiserror = "1.0.50"
parking_lot = "0.12.1"
dirs = "5.0.1"
tempfile = "3.8.1"
html-escape = "0.2.13"
rfd = { version = "0.12.1", optional = true }
md5 = "0.7.0"
hostname = "0.3.1"
once_cell = "1.18.0"
uuid = { version = "1.5.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }

[features]
default = ["file_dialog"]
hyperscan_engine = ["hyperscan"]
file_dialog = ["rfd"]
static_link = []
vendored-openssl = ["openssl"]

[build-dependencies]
pkg-config = "0.3"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "fileapi", "winbase"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.bundle]
name = "SDChat Scanner"
identifier = "com.sdchat.scanner"
icon = ["resources/icons/app_icon_32.png", "resources/icons/app_icon_128.png", "resources/icons/app_icon_256.png"]
version = "0.1.0"
copyright = "Copyright (c) 2023 SDChat Team. All rights reserved."
category = "Security"
short_description = "Security vulnerability scanner client"
long_description = """
SDChat Scanner is a desktop application for scanning code for security vulnerabilities.
It uses pattern matching to identify potential security issues in source code.
"""

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
